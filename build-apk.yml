name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # noetig, um die APK als Release anzuhaengen

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java einrichten (Capacitor 7 braucht JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: npm-Pakete installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Web-Dateien in das Android-Projekt kopieren
        run: npx cap sync android

      # Wichtig fuer "Daten bleiben erhalten": Android erlaubt ein Update der
      # installierten App nur, wenn die APK mit demselben Schluessel signiert ist.
      # Der Debug-Build nutzt ~/.android/debug.keystore – den legen wir fest vor.
      # Ohne diesen Schritt waere der Schluessel bei jedem CI-Lauf ein anderer
      # und man muesste die App deinstallieren (= alle Fotos weg).
      # Der Schluessel liegt als Base64-Textkopie im Repo (signing/debug.keystore.b64)
      # und wird hier wieder in die Originaldatei zurueckverwandelt.
      - name: Festen Signaturschluessel bereitstellen
        run: |
          mkdir -p ~/.android
          base64 -d signing/debug.keystore.b64 > ~/.android/debug.keystore

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/hitster-foto-trainer.apk
          ls -lh out/

      - name: APK als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: hitster-foto-trainer-apk
          path: out/hitster-foto-trainer.apk

      # Ein Release ist am Handy viel einfacher herunterzuladen als ein Artefakt
      # (kein ZIP, kein Login-Zwang bei oeffentlichen Repos).
      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/hitster-foto-trainer.apk \
            --title "Hitster Foto-Trainer (neuester Stand)" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Die Datei hitster-foto-trainer.apk auf dem Handy herunterladen und installieren."
